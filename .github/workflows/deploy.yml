name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (shared)
        run: cd packages/shared && npm install

      - name: Install and build bigscreen
        run: cd deyu-bigscreen && npm install && npm run build

      - name: Install and build tablet
        run: cd deyu-tablet && npm install && npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/deyu-bigscreen deploy/deyu-tablet
          cp -r deyu-bigscreen/dist/* deploy/deyu-bigscreen/
          cp -r deyu-tablet/dist/* deploy/deyu-tablet/
          # SPA fallback: copy index.html as 404.html for client-side routing
          cp deploy/deyu-bigscreen/index.html deploy/deyu-bigscreen/404.html
          cp deploy/deyu-tablet/index.html deploy/deyu-tablet/404.html
          # Create root index that redirects to bigscreen
          echo '<html><head><meta http-equiv="refresh" content="0;url=deyu-bigscreen/"></head></html>' > deploy/index.html
          # Add .nojekyll to prevent Jekyll processing
          touch deploy/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
